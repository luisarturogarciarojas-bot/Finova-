<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="finovaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="finovaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF385" />
      <stop offset="35%" stop-color="#FFCF00" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Emerald Dynamic Flow Gradient -->
    <linearGradient id="finovaEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFCF00" flood-opacity="0.25" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#finovaBg)" filter="url(#cardShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Outer Golden Ring / Vault Horizon -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#finovaGold)" stroke-width="4" stroke-dasharray="14 10" stroke-opacity="0.35" />

  <!-- Iconic 'F' + Upward Dynamic Geometric Ribbon -->
  <!-- Vertical Pillar of F -->
  <path d="M152 144 C152 135 159 128 168 128 L204 128 C213 128 220 135 220 144 L220 368 C220 377 213 384 204 384 L168 384 C159 384 152 377 152 368 Z"
        fill="url(#finovaGold)" filter="url(#glow)" />

  <!-- Top Horizontal Bar of F - Growing upward fintech chevron -->
  <path d="M220 160 L340 160 C352 160 360 172 354 182 L332 216 C328 222 322 226 314 226 L220 226 Z"
        fill="url(#finovaGold)" filter="url(#glow)" />

  <!-- Middle Bar of F with ascending arrow / Nova star crest -->
  <path d="M220 262 L298 262 C308 262 315 271 311 280 L296 308 C293 313 288 316 282 316 L220 316 Z"
        fill="url(#finovaGold)" opacity="0.9" />

  <!-- Nova Dynamic Growth Spark (Emerald Diamond Node) -->
  <path d="M362 256 L384 232 L406 256 L384 280 Z"
        fill="url(#finovaEmerald)" filter="url(#glow)" />

  <!-- Financial Horizon Dot -->
  <circle cx="384" cy="180" r="14" fill="#FFCF00" filter="url(#glow)" />
  <circle cx="256" cy="384" r="8" fill="#34D399" opacity="0.8" />
</svg>
